name: EM documentation consistency
on:
  push:
    branches: [implementation/em-affine-hp-20261005]
    paths: [.github/workflows/em-doc-check.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Correct documentation only and verify final tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          config=json.loads(Path('configs/v6_7_em_hp_smoke.json').read_text())
          assert config['hidden']==4
          p=Path('docs/EM_AFFINE_HP_RUNBOOK_KR.md')
          s=p.read_text();assert '8 optimizer updates, width8,' in s
          p.write_text(s.replace('8 optimizer updates, width8,','8 optimizer updates, width4,'))
          p=Path('THREE_PILLARS_SOURCE.sha256');rows=[]
          for line in p.read_text().splitlines():
              h,f=line.split('  ',1)
              rows.append(hashlib.sha256(Path(f).read_bytes()).hexdigest()+'  '+f)
          p.write_text('\n'.join(rows)+'\n')
          PY
          git rm .github/workflows/em-doc-check.yml
          git add docs/EM_AFFINE_HP_RUNBOOK_KR.md THREE_PILLARS_SOURCE.sha256
          test "$(git write-tree)" = 2b23357b8122f7568b288fb8ce8b46b52121cb6e
          sha256sum -c THREE_PILLARS_SOURCE.sha256
          sha256sum -c P_HEADROOM_SOURCE.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: correct smoke generator width and refresh manifest'
          git push origin HEAD:implementation/em-affine-hp-20261005

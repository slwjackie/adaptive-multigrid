name: EM affine HP integration validation
on:
  push:
    branches: [implementation/em-affine-hp-20261005]
    paths: [.github/workflows/em-integration.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and verify locally tested source tree
        run: python .implementation/apply.py
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Native serial kernel and full regression
        run: |
          python scripts/build_native_stencil.py --no-openmp
          mkdir -p artifacts/ci
          python -m pytest -ra --junitxml=artifacts/ci/pytest.xml
          sha256sum -c THREE_PILLARS_SOURCE.sha256 > artifacts/ci/manifest.log
          sha256sum -c P_HEADROOM_SOURCE.sha256 >> artifacts/ci/manifest.log
      - name: Publish verified staging tree only
        run: |
          test "$(git write-tree)" = 5ff4d918977f386bfb2a79c0e26a0286628541b8
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement warm EM plans and asymptotic affine H_P'
          git push origin HEAD:implementation/em-affine-hp-20261005
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          data={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'base':'aded8e267f247c84df1948cd9dc2334dce606d91','scope':'exact tested source; no research performance certification'}
          Path('artifacts/ci/publication.json').write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: em-affine-hp-ci
          path: artifacts/ci/
          retention-days: 14

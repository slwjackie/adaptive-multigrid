name: Implementation source snapshot
on:
  push:
    branches: [implementation/em-affine-hp-20261005]
    paths: [.github/workflows/implementation-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aded8e267f247c84df1948cd9dc2334dce606d91
      - run: git archive --format=tar HEAD -o /tmp/baseline-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-baseline-source
          path: /tmp/baseline-source.tar
          retention-days: 1

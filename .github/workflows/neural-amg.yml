name: Neural AMG validation
on:
  push:
    branches: [neural-amg]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' -r requirements-neural-amg.txt
      - name: Build optional native stencil
        run: python scripts/build_native_stencil.py --no-openmp
      - name: Full regression
        run: |
          mkdir -p artifacts/ci
          python -m pytest -ra --junitxml=artifacts/ci/pytest.xml
      - name: Verify inherited numerical sources
        run: |
          sha256sum -c THREE_PILLARS_SOURCE.sha256
          sha256sum -c P_HEADROOM_SOURCE.sha256
          sha256sum -c WORLD_MODEL_SOURCE.sha256
          sha256sum -c HS_WORLD_SOURCE.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-amg-validation
          path: artifacts/ci/

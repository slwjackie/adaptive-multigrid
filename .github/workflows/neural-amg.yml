name: Neural AMG validation
on:
  push:
    branches: [neural-amg]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Full regression
        run: |
          mkdir -p artifacts/ci
          python -m pytest -ra --junitxml=artifacts/ci/pytest.xml
      - name: P1 smoke train, freeze and evaluation
        run: |
          python scripts/run_neural_amg.py train --config configs/neural_amg_smoke.json --run-dir artifacts/ci/smoke
          python scripts/run_neural_amg.py freeze --config configs/neural_amg_smoke.json --run-dir artifacts/ci/smoke
          python scripts/run_neural_amg.py evaluate --config configs/neural_amg_smoke.json --run-dir artifacts/ci/smoke
          python scripts/run_neural_amg.py evaluate --config configs/neural_amg_smoke.json --run-dir artifacts/ci/smoke --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-amg-validation
          path: artifacts/ci/
